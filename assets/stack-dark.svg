<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-label="Stack. frontend: React, Next.js, Tailwind CSS. backend: TypeScript, NestJS, Express, Prisma, Python. dados: PostgreSQL, Redis, MongoDB, BullMQ. infra: Linux, Docker, Nginx, PM2, Let's Encrypt.">
  <title>Stack. frontend: React, Next.js, Tailwind CSS. backend: TypeScript, NestJS, Express, Prisma, Python. dados: PostgreSQL, Redis, MongoDB, BullMQ. infra: Linux, Docker, Nginx, PM2, Let's Encrypt.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #020617; }
    .rule { fill: #1e293b; }
    .fg { fill: #e2e8f0; }
    .muted { fill: #94a3b8; }
    .prompt { fill: #38bdf8; }
    .accent { fill: #60a5fa; }
    .ok { fill: #4ade80; }
    .logo { fill: #ffffff; }
    .b { font-weight: 600; }

    .sel { animation: sel 10s steps(4) infinite; }
    @keyframes sel { to { transform: translateY(160px); } }
    @media (prefers-reduced-motion: reduce) { .sel { animation: none; } }
  </style>
  
  <rect x=".5" y=".5" width="719" height="251" rx="6" fill="#020617" stroke="#1e293b"/>
  <text x="28" y="42" font-size="17" class="prompt">~ $</text><text x="70" y="42" font-size="17" class="fg">cat stack.yml</text>
  <g class="sel">
    <rect x="14" y="66" width="692" height="34" rx="4" fill="#60a5fa" fill-opacity=".12"/>
    <text x="20" y="89" font-size="17" class="prompt">›</text>
  </g>
  <text x="40" y="89" font-size="16" class="accent">frontend:</text>
