  <text x="346" y="129" font-size="16" class="fg">Express</text>
  <text x="436" y="129" font-size="16" class="fg">Prisma</text>
  <text x="522" y="129" font-size="16" class="fg">Python</text>
  <text x="40" y="169" font-size="16" class="accent">dados:</text>
  <text x="140" y="169" font-size="16" class="fg">PostgreSQL</text>
  <text x="256" y="169" font-size="16" class="fg">Redis</text>
  <text x="346" y="169" font-size="16" class="fg">MongoDB</text>
  <text x="436" y="169" font-size="16" class="fg">BullMQ</text>
