<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Víctor César, Desenvolvedor Full Stack / DevOps · Santo Estêvão, Bahia. Em produção desde jan/2023, 15 aplicações, 3.000 usuários por dia.">
  <title>Víctor César, Desenvolvedor Full Stack / DevOps · Santo Estêvão, Bahia. Em produção desde jan/2023, 15 aplicações, 3.000 usuários por dia.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #020617; }
    .rule { fill: #1e293b; }
    .fg { fill: #e2e8f0; }
    .muted { fill: #94a3b8; }
    .prompt { fill: #38bdf8; }
    .accent { fill: #60a5fa; }
    .ok { fill: #4ade80; }
    .logo { fill: #ffffff; }
    .b { font-weight: 600; }

    .show { animation: show .35s ease-out var(--d) backwards; }
    .type { opacity: 0; animation: type calc(var(--n) * 70ms) steps(var(--n)) var(--d) backwards; }
    .blink { animation: blink 1.1s step-end infinite, show 0s linear var(--d) backwards; }
    @keyframes show { from { opacity: 0; } }
    @keyframes type { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(var(--w)); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .show, .type, .blink { animation: none; } }
  </style>
  
  <rect x=".5" y=".5" width="719" height="329" rx="6" fill="#020617" stroke="#1e293b"/>
  <g transform="translate(28 22) scale(.625)">
    <polygon points="6,14 18,14 27,38 27,50 21,50" class="logo"/>
    <polygon points="27,38 36,14 48,14 33,50 27,50" fill="#3b82f6"/>
    <rect x="44" y="42" width="14" height="8" rx="2" fill="#38bdf8"/>
  </g>
  <text x="692" y="50" font-size="14" class="muted" text-anchor="end">victorcesar.com.br</text>

  <text x="28" y="112" font-size="17" class="prompt">~ $</text><text x="70" y="112" font-size="17" class="fg">whoami</text>
  <g class="type" style="--n: 6; --w: 64px; --d: 0.5s">
    <rect x="69" y="92" width="72" height="26" class="bg"/>
    <rect x="69" y="95" width="10" height="21" class="prompt"/>
  </g>
  <text x="28" y="156" font-size="32" class="fg b show" style="--d: 1.05s">Víctor César</text>
  <text x="28" y="186" font-size="16" class="muted show" style="--d: 1.15s">Desenvolvedor Full Stack / DevOps · Santo Estêvão, Bahia</text>

  <g class="show" style="--d: 1.6s">
  <text x="28" y="236" font-size="17" class="prompt">~ $</text><text x="70" y="236" font-size="17" class="fg">uptime</text>
  <g class="type" style="--n: 6; --w: 64px; --d: 1.65s">
    <rect x="69" y="216" width="72" height="26" class="bg"/>
    <rect x="69" y="219" width="10" height="21" class="prompt"/>
  </g>
  </g>
  <text x="28" y="266" font-size="16" class="fg show" style="--d: 2.2s">em produção desde jan/2023 · <tspan class="accent">15</tspan> aplicações · <tspan class="accent">3.000</tspan> usuários/dia</text>

  <text x="28" y="306" font-size="17" class="prompt show" style="--d: 2.6s">~ $</text>
