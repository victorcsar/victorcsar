<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Víctor César, Desenvolvedor Full Stack / DevOps">
  <title>Víctor César, Desenvolvedor Full Stack / DevOps</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }

    /* Cada comando é revelado por uma tarja da cor do fundo que anda para a direita,
       uma letra por passo, levando o cursor na frente. Depois a saída aparece. */
    .show { animation: show .35s ease-out var(--d) backwards; }
    .type { opacity: 0; animation: type calc(var(--n) * 70ms) steps(var(--n)) var(--d) backwards; }
    .blink { animation: blink 1.1s step-end infinite, show 0s linear var(--d) backwards; }
    @keyframes show { from { opacity: 0; } }
    @keyframes type { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(var(--w)); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .show, .type, .blink { animation: none; }
    }
  </style>

  <rect x=".5" y=".5" width="839" height="329" rx="6" fill="#020617" stroke="#1e293b"/>

  <g transform="translate(32 22) scale(.625)">
    <polygon points="6,14 18,14 27,38 27,50 21,50" fill="#ffffff"/>
    <polygon points="27,38 36,14 48,14 33,50 27,50" fill="#3b82f6"/>
    <rect x="44" y="42" width="14" height="8" rx="2" fill="#38bdf8"/>
  </g>
  <text x="808" y="50" text-anchor="end" font-size="14" fill="#94a3b8">victorcesar.com.br</text>

  <text x="32" y="112" font-size="17" fill="#38bdf8">~ $</text>
  <text x="74" y="112" font-size="17" fill="#e2e8f0">whoami</text>
  <g class="type" style="--n: 6; --w: 64px; --d: .5s">
    <rect x="73" y="92" width="72" height="26" fill="#020617"/>
    <rect x="73" y="95" width="10" height="21" fill="#38bdf8"/>
  </g>

  <text x="32" y="156" font-size="32" font-weight="600" fill="#e2e8f0" class="show" style="--d: 1.05s">Víctor César</text>
  <text x="32" y="186" font-size="16" fill="#94a3b8" class="show" style="--d: 1.15s">Desenvolvedor Full Stack / DevOps · Santo Estêvão, Bahia</text>

  <g class="show" style="--d: 1.6s">
    <text x="32" y="236" font-size="17" fill="#38bdf8">~ $</text>
    <text x="74" y="236" font-size="17" fill="#e2e8f0">uptime</text>
    <g class="type" style="--n: 6; --w: 64px; --d: 1.65s">
      <rect x="73" y="216" width="72" height="26" fill="#020617"/>
      <rect x="73" y="219" width="10" height="21" fill="#38bdf8"/>
    </g>
  </g>

  <text x="32" y="266" font-size="16" fill="#e2e8f0" class="show" style="--d: 2.2s">em produção desde jan/2023 · <tspan fill="#60a5fa">15</tspan> aplicações · <tspan fill="#60a5fa">3.000</tspan> usuários/dia</text>

  <text x="32" y="306" font-size="17" fill="#38bdf8" class="show" style="--d: 2.6s">~ $</text>
  <rect x="73" y="289" width="10" height="21" fill="#38bdf8" class="blink" style="--d: 2.6s"/>
</svg>
