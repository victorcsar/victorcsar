<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" role="img" aria-label="Stack. frontend: React, Next.js, Tailwind CSS. backend: TypeScript, NestJS, Express, Prisma, Python. dados: PostgreSQL, Redis, MongoDB, BullMQ. infra: Linux, Docker, Nginx, PM2, Let's Encrypt. cloud: AWS Certified Cloud Practitioner.">
  <title>Stack. frontend: React, Next.js, Tailwind CSS. backend: TypeScript, NestJS, Express, Prisma, Python. dados: PostgreSQL, Redis, MongoDB, BullMQ. infra: Linux, Docker, Nginx, PM2, Let's Encrypt. cloud: AWS Certified Cloud Practitioner.</title>
