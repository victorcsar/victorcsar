<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" width="720" height="308" role="img" aria-label="watch docker ps. Sistemas de uma provedora de internet, da arquitetura ao deploy. app-cliente: no ar, ~3.000 usuários/dia. assinatura-contratos: no ar, centenas de contratos/mês. plataforma-rh: no ar, ~100 colaboradores. servidores: no ar, 15 aplicações migradas.">
  <title>watch docker ps. Sistemas de uma provedora de internet, da arquitetura ao deploy. app-cliente: no ar, ~3.000 usuários/dia. assinatura-contratos: no ar, centenas de contratos/mês. plataforma-rh: no ar, ~100 colaboradores. servidores: no ar, 15 aplicações migradas.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #f8fafc; }
    .rule { fill: #e2e8f0; }
    .fg { fill: #0f172a; }
    .muted { fill: #64748b; }
    .prompt { fill: #0284c7; }
    .accent { fill: #2563eb; }
    .ok { fill: #16a34a; }
    .logo { fill: #0f172a; }
    .b { font-weight: 600; }

    .refresh { transform-box: fill-box; transform-origin: left; animation: refresh 5s linear infinite; }
    @keyframes refresh { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.5s ease-in-out var(--d) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .rows { animation: rows 5s steps(1) infinite; }
    @keyframes rows { 0% { opacity: .55; } 4% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .refresh, .pulse, .rows { animation: none; } }
  </style>
  
  <rect x=".5" y=".5" width="719" height="307" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="42" font-size="17" class="prompt">~ $</text><text x="70" y="42" font-size="17" class="fg">watch docker ps</text>
  <text x="692" y="42" font-size="14" class="muted" text-anchor="end">a cada 5,0s</text>
  <text x="28" y="70" font-size="15" class="muted"># provedora de internet, da arquitetura ao deploy</text>
  <rect x="28" y="86" width="664" height="2" class="rule"/>
  <rect x="28" y="86" width="664" height="2" class="prompt refresh"/>

  <text x="28" y="124" font-size="13" class="muted" letter-spacing="1.5">SISTEMA</text>
  <text x="300" y="124" font-size="13" class="muted" letter-spacing="1.5">STATUS</text>
  <text x="400" y="124" font-size="13" class="muted" letter-spacing="1.5">ESCALA</text>

  <g class="rows">
    <text x="28" y="168" font-size="18" class="fg b">app-cliente</text>
    <circle cx="306" cy="162" r="5" class="ok pulse" style="--d: 0.0s"/>
    <text x="320" y="168" font-size="17" class="ok">up</text>
    <text x="400" y="168" font-size="17" class="accent">~3.000 usuários/dia</text>
    <text x="28" y="210" font-size="18" class="fg b">assinatura-contratos</text>
    <circle cx="306" cy="204" r="5" class="ok pulse" style="--d: 0.4s"/>
    <text x="320" y="210" font-size="17" class="ok">up</text>
    <text x="400" y="210" font-size="17" class="accent">centenas de contratos/mês</text>
    <text x="28" y="252" font-size="18" class="fg b">plataforma-rh</text>
    <circle cx="306" cy="246" r="5" class="ok pulse" style="--d: 0.8s"/>
    <text x="320" y="252" font-size="17" class="ok">up</text>
    <text x="400" y="252" font-size="17" class="accent">~100 colaboradores</text>
    <text x="28" y="294" font-size="18" class="fg b">servidores</text>
    <circle cx="306" cy="288" r="5" class="ok pulse" style="--d: 1.2s"/>
    <text x="320" y="294" font-size="17" class="ok">up</text>
    <text x="400" y="294" font-size="17" class="accent">15 aplicações migradas</text>
  </g>
</svg>
